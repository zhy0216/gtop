<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <rect width="128" height="128" rx="28" fill="#1a1a2e"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <!-- Chart area background -->
  <rect x="16" y="36" width="96" height="60" rx="8" fill="#0f3460" opacity="0.4"/>
  <!-- Grid lines -->
  <line x1="16" y1="56" x2="112" y2="56" stroke="#0f3460" stroke-width="0.5" opacity="0.6"/>
  <line x1="16" y1="76" x2="112" y2="76" stroke="#0f3460" stroke-width="0.5" opacity="0.6"/>
  <!-- CPU chart line (green) -->
  <polyline points="20,82 32,78 44,68 52,72 60,58 68,52 76,60 84,48 92,44 100,50 108,42"
    stroke="#53d769" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- CPU chart fill -->
  <polygon points="20,82 32,78 44,68 52,72 60,58 68,52 76,60 84,48 92,44 100,50 108,42 108,92 20,92"
    fill="url(#greenGrad)" opacity="0.3"/>
  <!-- Memory chart line (blue) -->
  <polyline points="20,86 32,84 44,80 52,82 60,76 68,74 76,78 84,70 92,72 100,68 108,66"
    stroke="#5ac8fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Memory chart fill -->
  <polygon points="20,86 32,84 44,80 52,82 60,76 68,74 76,78 84,70 92,72 100,68 108,66 108,92 20,92"
    fill="url(#blueGrad)" opacity="0.25"/>
  <!-- Title text "gtop" -->
  <text x="64" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
    font-size="16" font-weight="700" fill="#e0e0e0" letter-spacing="1">gtop</text>
  <!-- Status bar dots -->
  <circle cx="30" cy="106" r="4" fill="#53d769"/>
  <circle cx="50" cy="106" r="4" fill="#5ac8fa"/>
  <circle cx="70" cy="106" r="4" fill="#ff9f0a"/>
  <rect x="82" y="103" width="26" height="6" rx="3" fill="#0f3460"/>
  <rect x="82" y="103" width="18" height="6" rx="3" fill="#53d769" opacity="0.7"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#53d769" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#53d769" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ac8fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5ac8fa" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
